services:
  mongo:
    build:
      context: .
      dockerfile: Dockerfile
    image: mongo-dev:4.4
    container_name: local-mongo-dev
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - ./podman_data/mongo_dev:/data/db:z
    environment:
      TZ: Asia/Shanghai
    restart: unless-stopped
    healthcheck:
      # 真实认证查询：崩溃循环中 podman ps 也会闪现 Up，只有 ping 通过才算就绪
      test: ["CMD", "mongo", "--quiet", "-u", "dev", "-p", "123456", "--authenticationDatabase", "dev_db", "--eval", "quit(db.runCommand({ping:1}).ok === 1 ? 0 : 1)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: "1.5"
          memory: 1G
