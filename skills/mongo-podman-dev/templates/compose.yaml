
services:
  mongo:
    build:
      context: .
      dockerfile: Dockerfile
    image: mongo-dev:4.4
    container_name: local-mongo-dev
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - ./podman_data/mongo_dev:/data/db:z
    environment:
      TZ: Asia/Shanghai
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "1.5"
          memory: 1G
